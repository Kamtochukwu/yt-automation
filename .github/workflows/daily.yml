name: Daily YouTube Short

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which window to post"
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - night
        default: auto
  schedule:
    # One Short per window (Nigeria: 8am / 3pm / 9pm). Do not dump all 3 at once.
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  post-short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Do not use apt. Azure Ubuntu mirrors hung twice on 2026-08-19
      # and killed the morning slot before python started.
      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Ensure a caption font
        run: |
          if [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] \
            || [ -f /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf ]; then
            echo "Caption font already present"
          else
            sudo mkdir -p /usr/share/fonts/truetype/dejavu
            sudo curl -fsSL -o /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
              https://github.com/dejavu-fonts/dejavu-fonts/raw/version_2_37/ttf/DejaVuSans-Bold.ttf
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POST_SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: python main.py

      - name: Save used topics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/used_topics.json
          if git diff --cached --quiet; then
            echo "No used-topic changes"
          else
            git commit -m "Record posted SilentVision topic"
            git pull --rebase origin master
            git push
          fi

      - name: Notify phone if the post failed
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POST_SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: python -c "from src.notify import notify_failed; notify_failed()"
